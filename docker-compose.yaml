version: '3.2'

services:
  mongodb:
    image: mongo:latest
    container_name: "mongodb"
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    volumes:
      - ./data/db:/data/db
    ports:
      - 27017:27017
    command: mongod --smallfiles --storageEngine=wiredTiger --logpath=/dev/null # --quiet

  redis:
    build:
      context: ./docker
      dockerfile: redis.dockerfile
    ports:
      - 6379:6379

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "5671:5671"
      - "15672:15672"