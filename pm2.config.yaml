apps:
  - script: index.js
    name: scanner
    instances: 1
    exec_mode: fork
    args: --expose-gc

  - script: pending-transactions.js
    name: pending-transactions-scanner
    instances: 1
    exec_mode: fork
    args: --expose-gc

  - script: ./ethereum/workers/blocks/index.js
    name: blocks-listner
    instances: 1
    exec_mode: fork
    autorestart: true
    args: --expose-gc
    env:
      NSQ_READER_MAX_IN_FLIGHT: 5

  - script: ./ethereum/workers/blocks/index.js
    name: catching-up-blocks-listner
    instances: 1
    exec_mode: fork
    autorestart: true
    args: --expose-gc
    env:
      CATCHING_UP_MODE: true

  - script: ./ethereum/workers/contracts/index.js
    name: contracts-processing
    instances: 1
    exec_mode: fork
    autorestart: true
    args: --expose-gc
    env:
      NSQ_READER_MAX_IN_FLIGHT: 5

  - script: ./ethereum/workers/events/balances.js
    name: balances-processing
    instances: 1
    exec_mode: fork
    autorestart: true
    args: --expose-gc

  - script: ./ethereum/workers/events/push-notification.js
    name: push-notification
    instances: 1
    exec_mode: fork
    autorestart: true
    args: --expose-gc

  - script: ./ethereum/workers/pendings/transactions.js
    name: pending-transactions-worker
    instances: 1
    exec_mode: fork
    autorestart: true
    args: --expose-gc